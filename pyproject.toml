[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "modular-spec-agent"
version = "0.1.0"
description = "Deterministic task graph tools and reusable specification utilities"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.7,<3", "PyYAML>=6,<7"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
spec-agent = "spec_agent.__main__:main"

[tool.setuptools.packages.find]
include = ["spec_agent*", "sdlc_tools*"]

[tool.setuptools.package-data]
spec_agent = ["workflow/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
