'''
new = '''


def percentile(values, p):
    if not values or not 0 <= p <= 100:
        raise ValueError("percentile() needs values and 0 <= p <= 100")
    ordered = sorted(values)
    rank = max(1, math.ceil(p / 100 * len(ordered)))
    return ordered[rank - 1]
'''

[[implementation.revisions.1.actions]]
write = "tests/test_percentile.py"
content = '''
import pytest

from pilot_stats import percentile


def test_percentile_basic():
    assert percentile([1, 2, 3, 4], 0) == 1
    assert percentile([1, 2, 3, 4], 50) == 2
    assert percentile([1, 2, 3, 4], 100) == 4


def test_percentile_invalid():
    with pytest.raises(ValueError):
        percentile([], 50)
    with pytest.raises(ValueError):
        percentile([1], 101)
'''

[implementation.revisions.1.notes]
summary = "Use ceil-based nearest rank so p=100 returns the maximum and p=50 the lower median; extended tests to the failing cases."

