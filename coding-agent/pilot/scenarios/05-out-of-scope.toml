# Pilot scenario 05-out-of-scope: issue #5 slugify() drops accented letters
issue_id = 5
issue_title = "slugify() drops accented letters"
spec = '''
# Product spec: slugify() accents

Issue: #5

## Users
Sites generating URLs from titles.

## Problem
Accented letters are removed.

## Scope
In scope:
- Fix `slugify()`

Out of scope:
- CI changes
- Docs

## Requirements
- **REQ-1**: slugify() transliterates accented Latin letters instead of dropping them.

## Acceptance criteria
- **AC-1** (REQ-1): slugify('Crème Brûlée') == 'creme-brulee'
'''
requirements = [
  { id = "REQ-1", text = "slugify() transliterates accented Latin letters instead of dropping them." },
]
acceptance_criteria = [
  { id = "AC-1", requirement_ids = ["REQ-1"], description = "slugify('Crème Brûlée') == 'creme-brulee'", test_hints = ["tests/test_slugify_accents.py::test_accents"] },
]

[scope]
allowed_paths = ["src/pilot_stats/text.py"]

[environment]
test_command = "python -m pytest -q"
test_profile_id = "pytest-default-v1"
environment_manifest_id = "pilot-env-v1"

[expected]
status = "BLOCKED"
blocker = "SCOPE_VIOLATION"
violations = ["FORBIDDEN_PATH", "OUT_OF_SCOPE"]

[implementation]

[[implementation.actions]]
replace = "src/pilot_stats/text.py"
old = '''
import re
'''
new = '''
import re
import unicodedata
'''

[[implementation.actions]]
replace = "src/pilot_stats/text.py"
old = '''
    return re.sub(r"[^a-z0-9]+", "-", text.lower()).strip("-")
'''
new = '''
    text = unicodedata.normalize("NFKD", text).encode("ascii", "ignore").decode("ascii")
    return re.sub(r"[^a-z0-9]+", "-", text.lower()).strip("-")
'''

[[implementation.actions]]
write = "tests/test_slugify_accents.py"
content = '''
from pilot_stats import slugify


def test_accents():
    assert slugify('Crème Brûlée') == 'creme-brulee'
'''

[[implementation.actions]]
replace = ".github/workflows/ci.yml"
old = "pip install pytest && "
new = "pip install pytest unidecode && "

[[implementation.actions]]
replace = "README.md"
old = '''
# pilot-stats
'''
new = '''
# pilot-stats

Now with accent support!
'''

[implementation.notes]
summary = "Transliterate with unicodedata; also tweaked CI and README."

[implementation.notes.criteria]
AC-1 = { status = "IMPLEMENTED" }
