AC-1 = { status = "IMPLEMENTED", notes = "average of middle pair" }
AC-2 = { status = "IMPLEMENTED", notes = "explicit ValueError" }
AC-3 = { status = "IMPLEMENTED", notes = "odd path unchanged" }
